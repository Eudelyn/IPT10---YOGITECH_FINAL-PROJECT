<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yogi the Yogitech bunny">
  <g stroke="#0c0a17" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- left ear (straight) -->
    <path d="M20 31 C14.5 21 14 7 19.5 4.5 C25 2 28 14 27.5 28 Z" fill="#fcee0a"/>
    <!-- right ear (floppy tip) -->
    <path d="M36.5 28 C36.5 18 39 9 44 7.5 C49 6 54.5 9.5 57 14 C54 13 50.5 13.5 48.5 16 C46.5 19.5 45.5 25 44.5 31 Z" fill="#fcee0a"/>
  </g>
  <path d="M21.3 26.5 C18 19.5 17.8 10.5 20.2 9 C22.6 7.6 24.6 15 24.6 24 Z" fill="#ffb3d1"/>
  <path d="M40 25.5 C40.4 18.5 41.8 12.6 44.4 11.4 C46.4 10.6 49 11.2 50.6 12.3 C48.2 12.6 46 14 45 16.2 C43.6 19.4 42.8 22.8 42.2 26.5 Z" fill="#ffb3d1"/>
  <!-- head -->
  <ellipse cx="32" cy="41" rx="19.5" ry="16.5" fill="#fcee0a" stroke="#0c0a17" stroke-width="2.4"/>
  <!-- headphones -->
  <path d="M13.5 40 C13.5 25 22 20.5 32 20.5 C42 20.5 50.5 25 50.5 40" fill="none" stroke="#0c0a17" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M13.5 40 C13.5 25 22 20.5 32 20.5 C42 20.5 50.5 25 50.5 40" fill="none" stroke="#00f0ff" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="8.5" y="35" width="8" height="13" rx="3.5" fill="#00f0ff" stroke="#0c0a17" stroke-width="2.2"/>
  <rect x="47.5" y="35" width="8" height="13" rx="3.5" fill="#00f0ff" stroke="#0c0a17" stroke-width="2.2"/>
  <rect x="10.6" y="38.5" width="3.8" height="6" rx="1.6" fill="#ff2a6d"/>
  <rect x="49.6" y="38.5" width="3.8" height="6" rx="1.6" fill="#ff2a6d"/>
  <!-- eyes -->
  <ellipse cx="25" cy="40.5" rx="3.6" ry="4.4" fill="#0c0a17"/>
  <ellipse cx="39" cy="40.5" rx="3.6" ry="4.4" fill="#0c0a17"/>
  <circle cx="26.3" cy="38.8" r="1.5" fill="#fff"/>
  <circle cx="40.3" cy="38.8" r="1.5" fill="#fff"/>
