  <path d="M19.5 47 l1.4 -1.6 M22 47.3 l1.4 -1.6 M40.6 47.3 l1.4 -1.6 M43.1 47 l1.4 -1.6" stroke="#ff7fb0" stroke-width="1.3" stroke-linecap="round"/>
  <!-- nose + mouth + buck teeth -->
  <ellipse cx="32" cy="45.6" rx="1.9" ry="1.3" fill="#ff7fb0" stroke="#0c0a17" stroke-width="1"/>
  <path d="M32 47 v1.3 M32 48.3 c-.9 1.4 -2.9 1.4 -3.5 .2 M32 48.3 c.9 1.4 2.9 1.4 3.5 .2" fill="none" stroke="#0c0a17" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M30.4 49.3 h3.2 v2.1 a1.1 1.1 0 0 1 -1.1 1.1 h-1 a1.1 1.1 0 0 1 -1.1 -1.1 z" fill="#fff" stroke="#0c0a17" stroke-width=".9"/>
  <path d="M32 49.4 v2.9" stroke="#0c0a17" stroke-width=".7"/>
